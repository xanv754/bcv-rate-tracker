[project]
name = "bcv-scraper"
version = "0.1.0"
description = "Scheduled scraper that fetches official BCV (Banco Central de Venezuela) exchange rates and persists the full history to PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.15",
    "pydantic>=2.13",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2",
    "psycopg[binary]>=3.2",
    "rich>=15.0.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
bcv-scraper = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
